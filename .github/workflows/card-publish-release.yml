name: Card Publish Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release
      id-token: write # needed to mint the Sigstore/SLSA provenance attestation
      attestations: write # needed to upload the attestation to this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag is strictly greater than previous release
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: |
          CURR="${GITHUB_REF_NAME#v}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous release tag found — first release, proceeding."
            exit 0
          fi
          PREV="${PREV#v}"
          if [ "$PREV" = "$CURR" ]; then
            echo "Error: v$CURR already exists as a release tag."
            exit 1
          fi
          LOWER=$(printf '%s\n%s\n' "$PREV" "$CURR" | sort -V | head -1)
          if [ "$LOWER" != "$PREV" ]; then
            echo "Error: v$CURR is not greater than previous release v$PREV"
            exit 1
          fi
          echo "Tag v$CURR is valid (previous release: v$PREV)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: npm

      - uses: ./.github/actions/socket-firewall
        with:
          command: ci

      - run: npm test

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        run: npm run build:prod
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/card.js

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifact (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/card.js.sigstore.json \
            dist/card.js

      - name: Extract provenance DSSE envelope for OSSF Scorecard detection
        # Scorecard's Signed-Releases check greps release asset filenames for known signature
        # (.sigstore.json, etc.) and provenance (.intoto.jsonl) suffixes — it doesn't query
        # GitHub's Artifact Attestations API, so the attestation above is invisible to it under
        # its real filename. The attest-build-provenance bundle wraps a DSSE-enveloped in-toto
        # statement plus verification material; pull out just the envelope (the actual in-toto
        # attestation) as JSON Lines, rather than renaming the whole bundle.
        run: jq -ec .dsseEnvelope "${{ steps.attest.outputs.bundle-path }}" > dist/card.js.intoto.jsonl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/card.js
            dist/card.js.sigstore.json
            dist/card.js.intoto.jsonl
          generate_release_notes: true
          draft: true # always a draft — a human publishes from the Releases UI after review
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
