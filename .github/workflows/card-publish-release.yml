name: Card Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag is strictly greater than previous release
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: |
          CURR="${GITHUB_REF_NAME#v}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous release tag found — first release, proceeding."
            exit 0
          fi
          PREV="${PREV#v}"
          if [ "$PREV" = "$CURR" ]; then
            echo "Error: v$CURR already exists as a release tag."
            exit 1
          fi
          LOWER=$(printf '%s\n%s\n' "$PREV" "$CURR" | sort -V | head -1)
          if [ "$LOWER" != "$PREV" ]; then
            echo "Error: v$CURR is not greater than previous release v$PREV"
            exit 1
          fi
          echo "Tag v$CURR is valid (previous release: v$PREV)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        run: npm run build:prod
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Derive bundle name from package.json
        id: name
        # Named explicitly rather than globbing dist/ — a wrong filename must fail the
        # release, not ship a mystery asset. HACS resolves it via hacs.json "filename".
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ steps.name.outputs.name }}.js
          generate_release_notes: true
          draft: true # always a draft — a human publishes from the Releases UI after review
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
