name: Claude PR Review

# Second-reviewer bot: only ever engages with PRs opened by the repo owner. Called as a
# workflow_call step from pr-pipeline.yml, after that orchestrator's `build` and `codeql` jobs have
# both succeeded (enforced there via `needs:`), so ordering and single-run-per-push are structural
# instead of hand-rolled here.

on:
  workflow_call:

permissions: {}

jobs:
  review:
    if: github.event.pull_request.user.login == 'marcintk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action requests an OIDC token to exchange for its scoped GitHub App token; it
      # fails without this.
      id-token: write

    steps:
      # Deliberately does NOT check out the PR's head SHA: this job holds secrets
      # (CLAUDE_CODE_OAUTH_TOKEN) and pull-requests:write. Pinning `ref` to the PR's base branch
      # (rather than omitting it, which under a pull_request-triggered run would resolve to the PR's
      # merge ref) keeps Read/Grep/Glob on trusted content only — Claude reviews the PR's actual
      # diff via `gh pr diff` (one of the fixed `--allowedTools` `gh pr *` subcommands) instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Load review persona
        id: persona
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'text<<PERSONA_EOF'
            sed -e "s|{{REPO}}|$REPO|" -e "s|{{PR_NUMBER}}|$PR_NUMBER|" .github/claude-pr-review-prompt.md
            echo 'PERSONA_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.persona.outputs.text }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"
