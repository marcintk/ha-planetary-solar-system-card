name: HACS Validation

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS Action
        uses: hacs/action@22.5.0
        with:
          category: plugin
