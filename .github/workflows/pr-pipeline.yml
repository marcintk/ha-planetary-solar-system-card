name: PR Pipeline

# Runs build + CodeQL for every PR into main (required for merge), then the Claude second-review
# only after both succeed. Ordering and single-run-per-push come from `needs:` below instead of the
# workflow_run polling/dedup logic this replaced — see git history on claude-pr-review.yml for that.

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/card-build-and-test.yml

  codeql:
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    uses: ./.github/workflows/codeql-analysis.yml

  review:
    needs: [build, codeql]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/claude-pr-review.yml
