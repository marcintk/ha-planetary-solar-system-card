<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sun Halo — Tuning Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      color: #e5e7eb;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      gap: 20px;
    }

    h1 { font-size: 1.25rem; font-weight: 600; color: #f9fafb; }

    .subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 460px;
      line-height: 1.5;
    }

    .card-wrapper { width: 420px; max-width: 100%; }

    ha-planetary-solar-system-card { display: block; width: 100%; }

    .panel {
      width: 420px;
      max-width: 100%;
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row { display: flex; flex-direction: column; gap: 4px; }

    .row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .row label b { color: #fbbf24; font-variant-numeric: tabular-nums; }

    input[type="range"] { width: 100%; accent-color: #fbbf24; }

    .actions { display: flex; gap: 10px; }

    button {
      flex: 1;
      background: #374151;
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:hover { background: #4b5563; }

    pre {
      background: #0b1220;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 12px;
      font-size: 0.72rem;
      line-height: 1.5;
      color: #9ca3af;
      overflow-x: auto;
      white-space: pre;
    }
    pre b { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>Sun Halo — Tuning Harness</h1>
  <p class="subtitle">
    Live-tweak the Sun halo on your real card (Chicago). Sliders re-apply
    continuously, surviving the card's SVG rebuilds and zoom re-scales.
    The box at the bottom shows the exact values to bake into
    <code>src/renderer/bodies.ts</code>.
  </p>

  <div class="card-wrapper">
    <ha-planetary-solar-system-card id="demo-card"></ha-planetary-solar-system-card>
  </div>

  <div class="panel">
    <div class="row">
      <label>Radius (fraction of view)<b id="v-frac">0.33</b></label>
      <input type="range" id="s-frac" min="0.15" max="1" step="0.01" value="0.33" />
    </div>
    <div class="row">
      <label>Core opacity — stop 0%<b id="v-core">0.35</b></label>
      <input type="range" id="s-core" min="0" max="0.7" step="0.01" value="0.35" />
    </div>
    <div class="row">
      <label>Mid opacity — stop offset<b id="v-mid">0.10</b></label>
      <input type="range" id="s-mid" min="0" max="0.4" step="0.01" value="0.1" />
    </div>
    <div class="row">
      <label>Mid stop position<b id="v-midpos">54%</b></label>
      <input type="range" id="s-midpos" min="10" max="95" step="1" value="54" />
    </div>
    <div class="actions">
      <button id="btn-reset">Reset to current</button>
      <button id="btn-off">Halo off</button>
      <button id="btn-copy">Copy snippet</button>
    </div>
    <pre id="out"></pre>
  </div>

  <script type="module">
    import "./card.js";

    const card = document.getElementById("demo-card");
    card.setConfig({ default_zoom: 2, gallery: { mode: "off" } });
    card.hass = {
      config: {
        latitude: 41.8781,
        longitude: -87.6298,
        time_zone: "America/Chicago",
        location_name: "Chicago",
      },
    };

    // Committed defaults (src/renderer/bodies.ts) — "Reset to current" restores these.
    const DEFAULTS = { frac: 0.33, core: 0.35, mid: 0.1, midpos: 54 };
    const HALO_COLOR = "#ffcf6b";
    const CORE_COLOR = "#ffd479";

    const els = {
      frac: document.getElementById("s-frac"),
      core: document.getElementById("s-core"),
      mid: document.getElementById("s-mid"),
      midpos: document.getElementById("s-midpos"),
    };
    const out = document.getElementById("out");

    const state = () => ({
      frac: parseFloat(els.frac.value),
      core: parseFloat(els.core.value),
      mid: parseFloat(els.mid.value),
      midpos: parseInt(els.midpos.value, 10),
    });

    function deepQuery(root, sel) {
      const hit = root.querySelector?.(sel);
      if (hit) return hit;
      const walk = root.querySelectorAll?.("*") ?? [];
      for (const node of walk) {
        if (node.shadowRoot) {
          const inner = deepQuery(node.shadowRoot, sel);
          if (inner) return inner;
        }
      }
      return null;
    }

    function applyHalo() {
      const s = state();
      const grad = deepQuery(card.shadowRoot, "#sun-halo");
      const glow = deepQuery(card.shadowRoot, "#sun-halo-glow");
      if (grad) {
        const stops = grad.querySelectorAll("stop");
        if (stops[0]) {
          stops[0].setAttribute("stop-color", CORE_COLOR);
          stops[0].setAttribute("stop-opacity", String(s.core));
        }
        if (stops[1]) {
          stops[1].setAttribute("offset", s.midpos + "%");
          stops[1].setAttribute("stop-color", HALO_COLOR);
          stops[1].setAttribute("stop-opacity", String(s.mid));
        }
        if (stops[2]) {
          stops[2].setAttribute("stop-color", HALO_COLOR);
          stops[2].setAttribute("stop-opacity", "0");
        }
      }
      if (glow) {
        const svg = glow.ownerSVGElement;
        const vbW = svg?.viewBox?.baseVal?.width || 0;
        if (vbW) glow.setAttribute("r", String(vbW * s.frac));
      }
      renderReadout(s);
    }

    function renderReadout(s) {
      document.getElementById("v-frac").textContent = s.frac.toFixed(2);
      document.getElementById("v-core").textContent = s.core.toFixed(2);
      document.getElementById("v-mid").textContent = s.mid.toFixed(2);
      document.getElementById("v-midpos").textContent = s.midpos + "%";
      out.innerHTML =
        `export const <b>HALO_VIEW_FRACTION</b> = ${s.frac};\n\n` +
        `stop("0%",   "${CORE_COLOR}", "<b>${s.core}</b>");\n` +
        `stop("${s.midpos}%",  "${HALO_COLOR}", "<b>${s.mid}</b>");\n` +
        `stop("100%", "${HALO_COLOR}", "0");`;
    }

    for (const el of Object.values(els)) {
      el.addEventListener("input", applyHalo);
    }
    document.getElementById("btn-reset").addEventListener("click", () => {
      els.frac.value = DEFAULTS.frac;
      els.core.value = DEFAULTS.core;
      els.mid.value = DEFAULTS.mid;
      els.midpos.value = DEFAULTS.midpos;
      applyHalo();
    });
    document.getElementById("btn-off").addEventListener("click", () => {
      els.core.value = 0;
      els.mid.value = 0;
      applyHalo();
    });
    document.getElementById("btn-copy").addEventListener("click", () => {
      navigator.clipboard?.writeText(out.textContent);
    });

    // The card rebuilds its SVG imperatively on every update and resets the halo
    // radius on zoom — re-apply on a steady tick so the sliders always win.
    setInterval(applyHalo, 200);
    applyHalo();
  </script>
</body>
</html>
