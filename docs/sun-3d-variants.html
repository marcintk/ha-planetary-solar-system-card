<title>Drawing the Sun in 3D</title>
<meta name="description" content="Ways to render the Sun disc in display:3d — it's a light source, not a shaded ball — each shown with the real halo." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    --ground: #0c111b; --sky: #0d1420; --edge: rgba(255,255,255,0.09);
    --well: #0a0e17; --ink: #eef2f8; --dim: #9aa7bc; --faint: #616f88; --accent: #f4b13c;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --disp: "Chivo", "IBM Plex Sans", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ground); color: var(--ink); font: 400 14px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased; padding: 0 20px 80px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { padding: 52px 0 22px; border-bottom: 1px solid var(--edge); }
  h1 { font: 700 28px/1.16 var(--disp); letter-spacing: -0.01em; }
  .lede { margin-top: 12px; max-width: 66ch; color: var(--dim); font-size: 15px; }
  code { font-family: var(--mono); font-size: 0.85em; color: var(--ink);
    background: var(--well); padding: 0.08em 0.34em; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 26px; }
  .cell { background: var(--sky); border: 1px solid var(--edge); border-radius: 12px;
    overflow: hidden; }
  .cell svg { display: block; width: 100%; height: auto; background: #0b0f18; }
  .cap { padding: 12px 14px 14px; }
  .cap h2 { font: 600 13px/1.3 var(--disp); }
  .cap h2 .tag { font: 500 9px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.05em;
    margin-left: 6px; padding: 2px 5px; border-radius: 999px; border: 1px solid var(--accent);
    color: var(--accent); vertical-align: 2px; }
  .cap p { margin-top: 4px; color: var(--dim); font-size: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 22px; } }
</style>

<div class="wrap">
  <header>
    <h1>Drawing the Sun in 3D</h1>
    <p class="lede">
      The Sun is a light source, so the Lambert sphere sprite (which gives it a shaded limb and a
      viewer-side highlight, like a planet) reads wrong. Each option below is the Sun disc at
      real proportions with the actual <code>#sun-halo</code> behind it. Pick one.
    </p>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
  (function () {
    "use strict";
    const NS = "http://www.w3.org/2000/svg";
    const VB = 220, C = 110, R = 34, HALO = 96;   // scaled up from the card's r=16 / halo 264
    const GOLD = "#ffd700";

    const el = (t, a, p) => {
      const n = document.createElementNS(NS, t);
      for (const k in a) n.setAttribute(k, a[k]);
      if (p) p.appendChild(n);
      return n;
    };

    function scene(build) {
      const svg = el("svg", { viewBox: `0 0 ${VB} ${VB}`, xmlns: NS });
      const defs = el("defs", {}, svg);
      // the real halo gradient
      const halo = el("radialGradient", { id: "h", cx: "0.5", cy: "0.5", r: "0.5" }, defs);
      el("stop", { offset: "0%", "stop-color": "#ffd479", "stop-opacity": "0.35" }, halo);
      el("stop", { offset: "54%", "stop-color": "#ffcf6b", "stop-opacity": "0.1" }, halo);
      el("stop", { offset: "100%", "stop-color": "#ffcf6b", "stop-opacity": "0" }, halo);
      el("circle", { cx: C, cy: C, r: HALO, fill: "url(#h)" }, svg);
      build(svg, defs);
      return svg;
    }

    // A — flat disc (the 2d look)
    const flat = (svg) => el("circle", { cx: C, cy: C, r: R, fill: GOLD }, svg);

    // B — the current 3d: soft Lambert sphere sprite (approximated: offset highlight + dark limb)
    const softBall = (svg, defs) => {
      const g = el("radialGradient", { id: "sb", cx: "0.5", cy: "0.5", r: "0.55", fx: "0.4", fy: "0.4" }, defs);
      el("stop", { offset: "0%", "stop-color": "#fff2c0" }, g);
      el("stop", { offset: "45%", "stop-color": GOLD }, g);
      el("stop", { offset: "100%", "stop-color": "color-mix(in srgb, " + GOLD + " 45%, black)" }, g);
      el("circle", { cx: C, cy: C, r: R, fill: "url(#sb)" }, svg);
    };

    // C — emission radial: white-hot core -> gold -> warm rim, no dark limb, opaque
    const emission = (svg, defs) => {
      const g = el("radialGradient", { id: "em", cx: "0.5", cy: "0.5", r: "0.5" }, defs);
      el("stop", { offset: "0%", "stop-color": "#fff6d6" }, g);
      el("stop", { offset: "55%", "stop-color": GOLD }, g);
      el("stop", { offset: "100%", "stop-color": "#f2a500" }, g);
      el("circle", { cx: C, cy: C, r: R, fill: "url(#em)" }, svg);
    };

    // D — emission that dissolves into the halo: last stop = the halo's own colour
    const bloom = (svg, defs) => {
      const g = el("radialGradient", { id: "bl", cx: "0.5", cy: "0.5", r: "0.5" }, defs);
      el("stop", { offset: "0%", "stop-color": "#fff6d6" }, g);
      el("stop", { offset: "50%", "stop-color": GOLD }, g);
      el("stop", { offset: "86%", "stop-color": "#ffcf6b" }, g);
      el("stop", { offset: "100%", "stop-color": "#ffcf6b", "stop-opacity": "0.35" }, g);
      el("circle", { cx: C, cy: C, r: R * 1.08, fill: "url(#bl)" }, svg);
    };

    // E — flat gold disc + a small white-hot pinhole highlight at centre
    const pinhole = (svg, defs) => {
      el("circle", { cx: C, cy: C, r: R, fill: GOLD }, svg);
      const g = el("radialGradient", { id: "ph", cx: "0.5", cy: "0.5", r: "0.5" }, defs);
      el("stop", { offset: "0%", "stop-color": "#ffffff", "stop-opacity": "0.9" }, g);
      el("stop", { offset: "32%", "stop-color": "#fff2c0", "stop-opacity": "0" }, g);
      el("circle", { cx: C, cy: C, r: R, fill: "url(#ph)" }, svg);
    };

    // F — stylised two-tone: gold disc + a crisp brighter inner disc
    const core = (svg) => {
      el("circle", { cx: C, cy: C, r: R, fill: "#f0b010" }, svg);
      el("circle", { cx: C, cy: C, r: R * 0.62, fill: "#ffe98a" }, svg);
    };

    const items = [
      { n: "A · Flat disc", tag: "= 2d", d: "Plain <code>#ffd700</code> circle. The halo does all the depth work. Simplest — 3d and 2d Sun identical.", make: flat },
      { n: "B · Soft sphere sprite", tag: "now", d: "The current 3d: the Lambert sprite. Shaded limb + a viewer-side highlight — reads like a lit planet, not an emitter.", make: softBall },
      { n: "C · Emission radial", d: "White-hot centre → gold → a slightly deeper warm rim. Opaque, no dark side. Reads as a glowing sphere.", make: emission },
      { n: "D · Bloom into halo", d: "Like C, but the disc edge fades to the halo's own colour so there's no hard rim — the Sun and its glow are one object.", make: bloom },
      { n: "E · Flat + hot centre", d: "Flat gold disc with a small white pinhole highlight dead-centre. Minimal 3d hint, keeps a crisp edge.", make: pinhole },
      { n: "F · Two-tone core", d: "Stylised: a gold disc with a crisp brighter inner disc. Not realistic, but distinct and clean at tiny sizes.", make: core },
    ];

    const grid = document.getElementById("grid");
    for (const it of items) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.appendChild(scene(it.make));
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.innerHTML =
        `<h2>${it.n}${it.tag ? ` <span class="tag">${it.tag}</span>` : ""}</h2><p>${it.d}</p>`;
      cell.appendChild(cap);
      grid.appendChild(cell);
    }
  })();
</script>
